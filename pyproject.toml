[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["club/migrations", ".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["club", "config"]
omit = ["club/migrations/*", "club/tests.py", "club/test_*.py", "config/asgi.py", "config/wsgi.py"]
