name: footballgroup-demo

x-app: &app
  image: footballgroup-website:local
  pull_policy: never
  env_file: .env
  volumes:
    - media_data:/app/media
  init: true

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run python scripts/setup_demo.py}
      POSTGRES_USER: ${POSTGRES_USER:?Run python scripts/setup_demo.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup_demo.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    <<: *app
    build: .
    environment:
      DJANGO_RUN_BOOTSTRAP: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FOOTBALL_PORT:-8000}:8000"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro

  celery:
    <<: *app
    command: celery -A config worker -l info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 3"]
      interval: 20s
      timeout: 8s
      start_period: 20s
      retries: 5
    depends_on:
      web:
        condition: service_healthy

  celery-beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule --pidfile /tmp/celerybeat.pid
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from pathlib import Path; os.kill(int(Path('/tmp/celerybeat.pid').read_text()), 0)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
