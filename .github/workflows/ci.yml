name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Django / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python -m coverage run manage.py test
      - run: python -m coverage report --skip-empty

  frontend:
    name: React / browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci --prefix webapp
      - run: npm test --prefix webapp
      - run: npm run build --prefix webapp
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_browser.py

  docker:
    name: Docker / PostgreSQL / Celery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/setup_demo.py
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Public routes through Nginx
        run: |
          for route in /health/ / /team/ /matches/ /media/ /contacts/; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:8000$route"
          done
      - run: docker compose exec -T -e REDIS_URL= web python manage.py test
      - name: Queue round trip
        run: >-
          docker compose exec -T web python manage.py shell -c
          "from club.tasks import refresh_match_hub; result = refresh_match_hub.delay().get(timeout=30); assert 'recent' in result"
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down -v
